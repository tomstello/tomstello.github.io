<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>rain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
    }

    .word {
      color: #888;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      animation-delay: 30s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Audio control - hidden but accessible */
    audio {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    audio:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <p class="word">stay</p>

  <!--
    Rain audio - replace src with your audio file path
    You can use a royalty-free rain sound, or provide your own
    Suggested sources:
    - https://freesound.org (search "rain ambient")
    - https://pixabay.com/sound-effects/
  -->
  <audio autoplay loop id="rain-audio">
    <source src="assets/rain.mp3" type="audio/mpeg">
    <source src="assets/rain.ogg" type="audio/ogg">
    <!-- Fallback: If no local file, you can use a free CDN source -->
  </audio>

  <script>
    // Attempt to play audio on user interaction if autoplay is blocked
    document.body.addEventListener('click', function() {
      const audio = document.getElementById('rain-audio');
      if (audio.paused) {
        audio.play().catch(e => console.log('Audio play prevented'));
      }
    }, { once: true });

    // Allow escape key to leave
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.history.back();
      }
    });
  </script>
</body>
</html>
