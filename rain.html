<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>rain</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
    }

    .word {
      color: #888;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      opacity: 0;
      animation: fadeIn 3s ease forwards;
      animation-delay: 30s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <p class="word">stay</p>

  <script>
    // Allow escape key to leave
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        window.history.back();
      }
    });
  </script>
</body>
</html>
