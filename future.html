<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="What do you want to be true in five years?">
  <meta name="author" content="Thomas H. Costello">
  <link rel="canonical" href="https://thcostello.com/future.html">
  <meta property="og:title" content="Future — Thomas H. Costello">
  <meta property="og:description" content="What do you want to be true in five years?">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thcostello.com/future.html">
  <meta property="og:image" content="https://thcostello.com/assets/images/web/tom-2026-stairs.jpg">
  <meta property="og:site_name" content="Thomas H. Costello">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@tomstello_">
  <meta name="twitter:title" content="Future — Thomas H. Costello">
  <meta name="twitter:description" content="What do you want to be true in five years?">
  <meta name="twitter:image" content="https://thcostello.com/assets/images/web/tom-2026-stairs.jpg">
  <title>Future — Thomas H. Costello</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❧</text></svg>">
  <link rel="stylesheet" href="css/puck.css">
  <style>
    html { color-scheme: light dark; }
    body {
      max-width: 60rem;
      margin: 2.5rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      font-family: Georgia, serif;
    }
    h1, h2 { line-height: 1.2; font-weight: normal; }
    img { max-width: 100%; height: auto; }
    hr { border: none; border-top: 1px solid; margin: 2.5rem 0; }
    a { color: light-dark(#3d5a73, #9fbcd4); }
    ul { list-style: none; padding-left: 0; }
    li { margin-bottom: 0.8rem; }

    /* Future page only */
    body { text-align: center; }
    #answer {
      font: inherit; color: inherit; background: none;
      border: none; border-bottom: 1px solid currentColor;
      width: 100%; max-width: 32rem; padding: 0.75rem 0;
      text-align: center; outline: none;
    }
    #entries-container { max-width: 32rem; margin: 2.5rem auto 0; text-align: left; }
    .future-entry {
      display: flex; justify-content: space-between; gap: 1rem;
      padding: 0.5rem 0; border-bottom: 1px solid currentColor;
    }
    .future-entry:last-child { border-bottom: none; }
    .future-entry__text { font-style: italic; }
    #clear-btn {
      font: inherit; color: inherit; background: none; border: none;
      padding: 0; margin-top: 1rem; cursor: pointer; text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>What do you want to be true in five years?</h1>

  <input type="text" id="answer" placeholder="..." autocomplete="off" autofocus aria-label="Your answer">

  <div id="entries-container" style="display: none;">
    <h2>Your reflections</h2>
    <div id="entries-list"></div>
    <button id="clear-btn">clear all</button>
  </div>

  <hr>

  <p>← <a href="index.html">Home</a></p>

  <script>
    const input = document.getElementById('answer');
    const entriesContainer = document.getElementById('entries-container');
    const entriesList = document.getElementById('entries-list');
    const clearBtn = document.getElementById('clear-btn');

    function renderEntries() {
      const entries = JSON.parse(localStorage.getItem('future_entries') || '[]');

      if (entries.length > 0) {
        entriesContainer.style.display = 'block';
        entriesList.innerHTML = '';
        entries.slice().reverse().forEach(entry => {
          const date = new Date(entry.date);
          const formatted = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          const div = document.createElement('div');
          div.className = 'future-entry';
          const textSpan = document.createElement('span');
          textSpan.className = 'future-entry__text';
          textSpan.textContent = '"' + entry.text + '"';
          const dateSpan = document.createElement('span');
          dateSpan.className = 'future-entry__date';
          dateSpan.textContent = formatted;
          div.appendChild(textSpan);
          div.appendChild(dateSpan);
          entriesList.appendChild(div);
        });
      } else {
        entriesContainer.style.display = 'none';
      }
    }

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        const text = this.value.trim();
        const timestamp = new Date().toISOString();

        // Save locally
        const entries = JSON.parse(localStorage.getItem('future_entries') || '[]');
        entries.push({ text, date: timestamp });
        localStorage.setItem('future_entries', JSON.stringify(entries));

        // Send to Formspree
        fetch('https://formspree.io/f/mnjngpve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reflection: text, timestamp })
        }).catch(() => {});

        this.value = '';
        this.placeholder = 'noted.';
        setTimeout(() => {
          this.placeholder = '...';
        }, 2000);

        renderEntries();
      }
    });

    clearBtn.addEventListener('click', function() {
      if (confirm('Clear all your reflections?')) {
        localStorage.removeItem('future_entries');
        renderEntries();
      }
    });

    renderEntries();
  </script>
  <script src="js/puck.js"></script>
</body>
</html>
