<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Puck - 16x16 Icon -->
  <!-- Jester hat -->
  <rect x="2" y="1" width="2" height="2" fill="#7C3AED"/>
  <rect x="4" y="2" width="2" height="2" fill="#8B5CF6"/>
  <rect x="6" y="1" width="2" height="2" fill="#8B5CF6"/>
  <rect x="8" y="2" width="2" height="2" fill="#8B5CF6"/>
  <rect x="10" y="1" width="2" height="2" fill="#7C3AED"/>
  <rect x="1" y="3" width="2" height="1" fill="#c9a959"/>
  <rect x="12" y="3" width="2" height="1" fill="#c9a959"/>

  <!-- Face -->
  <rect x="4" y="4" width="2" height="2" fill="#FEEBC8"/>
  <rect x="6" y="4" width="2" height="2" fill="#FEEBC8"/>
  <rect x="8" y="4" width="2" height="2" fill="#FEEBC8"/>
  <rect x="4" y="6" width="2" height="2" fill="#FEEBC8"/>
  <rect x="6" y="6" width="2" height="2" fill="#FEEBC8"/>
  <rect x="8" y="6" width="2" height="2" fill="#FEEBC8"/>

