  <rect x="6" y="8" width="2" height="2" fill="#c9a959"/>
  <rect x="8" y="8" width="2" height="2" fill="#8B5CF6"/>

  <rect x="4" y="10" width="2" height="2" fill="#7C3AED"/>
  <rect x="6" y="10" width="2" height="2" fill="#8B5CF6"/>
  <rect x="8" y="10" width="2" height="2" fill="#7C3AED"/>

  <!-- Legs -->
  <rect x="5" y="12" width="2" height="2" fill="#4C1D95"/>
  <rect x="8" y="12" width="2" height="2" fill="#4C1D95"/>

